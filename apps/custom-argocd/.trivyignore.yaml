# Trivy risk acceptances for the custom-argocd build gate.
#
# Passed to the shared build workflow as `trivyignores`, which hands it to
# Trivy as --ignorefile. These are acceptances, not exploitability claims: the
# vulnerable code is present and, for most of these, reachable. Nothing here
# says the image is safe from them - it says the fix does not exist at this
# layer.
#
# Every entry lives in a Go binary shipped by quay.io/argoproj/argocd, which
# this Dockerfile consumes as a base image and does not build. There is no
# version of this repository that fixes them; only an Argo CD release compiled
# against a newer toolchain and newer modules does. Measured against
# quay.io/argoproj/argocd:v3.4.6: 128 fixable HIGH findings across five Go
# binaries - pebble, argocd, git-lfs, helm and kustomize - which collapse to
# the 46 package/CVE pairs below.
#
# VEX was considered and rejected. Trivy only suppresses on `not_affected`,
# which is a factual claim that the vulnerable code cannot be reached, and for
# findings in go-git, oras-go and net/http inside Argo CD's own request path
# that claim would be false. Ignore rules state the truth: known, unfixable
# here, accepted until a date.
#
# The purls are deliberately version-less, so an upstream bump that carries the
# same finding forward does not need this file edited. `expired_at` is what
# keeps that honest - on that date these findings fail the build again and have
# to be re-argued against whatever Argo CD ships by then. Do not extend a date
# without re-reading the entry.
#
# scan-published-images.yaml does not read this file, by design. It reports and
# never gates, so it keeps showing these every day - which is how the day one of
# them becomes fixable gets noticed.

