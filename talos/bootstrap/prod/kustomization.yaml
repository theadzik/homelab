# Rendered by ../../generate.sh, then embedded into the control-plane machine
# config as an inlineManifest. Not applied by kubectl directly, and never
# synced by ArgoCD - this is what gets a cluster to the point where ArgoCD
# exists at all. See ../../../docs/talos.md#bootstrapping-cilium-and-argocd.
#
# argo-cd is templated with values-secret.yaml included. generate.sh runs
# against an unlocked working tree, so kustomize reads it in plaintext and the
# Dex connector and repo credentials are baked into controlplane.yaml. That
# file already carries the whole cluster PKI and is git-ignored for exactly
# that reason.
#
# The prod overlay's argocd-server-transport.yaml is deliberately not among
# the resources below - it is a Traefik ServersTransport, and Traefik's CRD
# does not exist at boot. The `argocd` Application's second source is
# kubernetes/kustomizations/argocd/overlays/prod, so it picks that file up on
# its own once Traefik is running. That is why the files are listed one by one
# instead of referencing the kustomizations.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd # Namespace for the below resources, helm releases have their own targets
resources:
  - ../../../kubernetes/kustomizations/argocd/base/argocd-namespace.yaml
  - ../../../kubernetes/kustomizations/argocd/overlays/prod/argocd-bootstrap.yaml
  - ../../../kubernetes/kustomizations/argocd/base/argocd-gitcrypt-secret.yaml
helmCharts:
  - name: cilium
    repo: oci://quay.io/cilium/charts
    version: 1.20.0
    releaseName: cilium
    namespace: kube-system
    includeCRDs: true
    valuesFile: ../../../kubernetes/helm/cilium/values.yaml
    additionalValuesFiles:
      - ../../../kubernetes/helm/cilium/values-prod.yaml
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.2.2
    releaseName: argocd
    namespace: argocd
    includeCRDs: true
    additionalValuesFiles:
      - ../../../kubernetes/helm/argocd/values.yaml
      - ../../../kubernetes/helm/argocd/values-prod.yaml
      - ../../../kubernetes/helm/argocd/values-secret.yaml
