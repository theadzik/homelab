# Applied to every node type via `talosctl gen config --config-patch @patch-all.yaml`.
# See README.md in this directory for the full regeneration procedure.
#
# NOTE: this patch alone does NOT reproduce the live cluster. It must be paired
# with `secret-nut-client.yaml` for the NUT credentials, and with
# `secret-certs.yaml` via `--with-secrets` for the PKI and join tokens.
machine:
  kubelet:
    # Pinned so the generated config does not drift to whatever Kubernetes
    # version the local talosctl happens to default to. Bump together with the
    # control plane images below when upgrading Kubernetes.
    image: ghcr.io/siderolabs/kubelet:v1.35.1
    extraArgs:
      # Requires kubelet-serving-cert-approver in-cluster to approve the CSRs.
      rotate-server-certificates: true
  # https://docs.siderolabs.com/talos/v1.12/configure-your-talos-cluster/images-container-runtime/containerd#set-cdi-plugin-spec-dirs-to-writable-directories
  files:
    - path: /etc/cri/conf.d/20-customization.part
      op: create
      content: |
        [plugins."io.containerd.cri.v1.runtime"]
          cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
  install:
    disk: /dev/nvme0n1
    image: factory.talos.dev/installer/87286864e94c7d661c926a524c8e57f84d608488f0cd654a92b1e5f37d48b868:v1.13.7
cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true
    image: registry.k8s.io/kube-proxy:v1.35.1
  apiServer:
    image: registry.k8s.io/kube-apiserver:v1.35.1
  controllerManager:
    image: registry.k8s.io/kube-controller-manager:v1.35.1
  scheduler:
    image: registry.k8s.io/kube-scheduler:v1.35.1
