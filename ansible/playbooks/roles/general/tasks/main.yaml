- name: "Ensure common CLI tools are updated with brew."
  community.general.homebrew:
    name: "{{ item }}"
    state: latest
  loop:
    - ripgrep
    - fd
    - jq
    - yq
    - fzf
    - tree
    - shellcheck
    - shfmt
    - bat
    - eza
    - gh
    # Installed by bootstrap.sh to get ansible onto a new machine; kept current
    # from here, since every pipx task in the other roles runs through it.
    - pipx
