version: 2
registries:
  dhi-io:
    type: docker-registry
    url: https://dhi.io
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}
updates:
  - package-ecosystem: "pip"
    directories:
      - "/.github/scripts/sync-waves-inventory"
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 2
    # pip is one of the ecosystems where resolving a manifest can run code from
    # the package being resolved. Nothing here needs that, and denying it keeps
    # a compromised release away from Dependabot's registry credentials.
    insecure-external-code-execution: deny
  - package-ecosystem: "docker"
    directories:
      - "/apps/custom-argocd"
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 2
  - package-ecosystem: "docker"
    directories:
      - "/apps/vaultwarden/backup"
      - "/apps/vaultwarden/restore"
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 2
    registries:
      - dhi-io
    groups:
      vaultwarden-dockerfiles:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns:
          - "*"
  # Hook revs are pinned in .pre-commit-config.yaml and are the only copy of
  # those versions; hadolint, shellcheck and detect-secrets stop gaining rules
  # as soon as the pins go stale.
  - package-ecosystem: "pre-commit"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      pre-commit:
        patterns:
          - "*"
