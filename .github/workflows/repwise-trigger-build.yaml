name: repwise-trigger-build

on:
  push:
    tags:
      - "repwise-trigger-*"
  pull_request:
    paths:
      - "apps/repwise-trigger/**"
      - ".github/workflows/repwise-trigger-build.yaml"
  schedule:
    - cron: "52 11 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-tag:
    uses: ./.github/workflows/get-tag.yaml
    with:
      tag-prefix: "repwise-trigger-"
  repwise-trigger-build-push:
    uses: theadzik/github-workflows/.github/workflows/build-and-push.yaml@c83c3e8f6838981737c0eee922da5fcac368537e # v4.1.1
    needs: get-tag
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    with:
      # A pull request must build its own head, not the last released tag,
      # or the Dockerfile change under review is never actually exercised.
      git-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || needs.get-tag.outputs.git_tag }}
      tags: "type=raw,value=${{ needs.get-tag.outputs.docker_tag }}"
      registry: ghcr.io
      image-name: "${{ github.repository_owner }}/repwise-trigger"
      registry-username: ${{ github.actor }}
      extra-registry: dhi.io
      extra-registry-username: ${{ vars.DOCKERHUB_USERNAME }}
      context-path: "apps/repwise-trigger"
      scan: true
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      EXTRA_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
