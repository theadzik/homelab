name: vw-restore-build

on:
  push:
    tags:
      - "vw-restore-*"
  pull_request:
    paths:
      - "apps/vaultwarden/restore/**"
      - ".github/workflows/restore-build.yaml"
  schedule:
    - cron: "22 12 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-tag:
    uses: ./.github/workflows/get-tag.yaml
    with:
      tag-prefix: "vw-restore-"
  restore-build-push:
    uses: theadzik/github-workflows/.github/workflows/build-and-push.yaml@177bace11704171ede4a7a272e2b734bcad760df # v2.3.0
    needs: get-tag
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    with:
      # A pull request must build its own head, not the last released tag,
      # or the Dockerfile change under review is never actually exercised.
      git-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || needs.get-tag.outputs.git_tag }}
      tags: "type=raw,value=${{ needs.get-tag.outputs.docker_tag }}"
      registry: ghcr.io
      image-name: "${{ github.repository_owner }}/vw-restore"
      registry-username: ${{ github.actor }}
      extra-registry: dhi.io
      extra-registry-username: ${{ vars.DOCKERHUB_USERNAME }}
      context-path: "apps/vaultwarden/restore"
      scan: true
      # Dated acceptances for findings inside the copied rclone binary. Read the
      # file before extending a date; it is not a mute button.
      trivyignores: "apps/vaultwarden/restore/.trivyignore.yaml"
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      EXTRA_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
