on:
  workflow_call:
    inputs:
      git-ref:
        required: true
        type: string
      image-name:
        required: true
        type: string
      context-path:
        required: true
        type: string
      docker-tag:
        required: false
        type: string
        default: "latest"
      build-args:
        required: false
        type: string
      push:
        description: "Push and attest the image. Set false to build only (for example on pull requests)."
        required: false
        type: boolean
        default: true

env:
  REGISTRY: docker.io
  REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}
  IMAGE_NAME: ${{ inputs.image-name }}

jobs:
  build-push-sign:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git-ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Both logins run even on build-only pull requests: authenticated pulls
      # lift the anonymous Docker Hub rate limit, and dhi.io issues no
      # anonymous pull tokens at all. Same Docker account backs both.
      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REPOSITORY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to dhi.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: dhi.io
          username: ${{ env.REPOSITORY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.docker-tag }}

      # When publishing, push by digest with no tags: ArgoCD Image Updater finds
      # images by listing tags, so a tag published here - before the attestations
      # below exist - lets a deployment race its own attestation upload. The
      # Kyverno policy now denies rather than warns, so that race would reject
      # the pod. Tags are applied in the final step instead. When not publishing
      # (Dependabot PRs) this is a build-only validation.
      - name: Build and push by digest
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: "${{ inputs.context-path }}"
          platforms: "linux/amd64"
          outputs: ${{ inputs.push && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.REPOSITORY, env.IMAGE_NAME) || 'type=cacheonly' }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The local `docker` exporter used when not pushing rejects attestations.
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          build-args: |
            ${{ inputs.build-args }}

      - name: Extract buildx-generated SBOM
        id: sbom-extract
        if: inputs.push
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }} \
            --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        if: inputs.push
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest Provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        if: inputs.push
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # Only now does the image become discoverable, with its attestations
      # already in place. `imagetools create` re-pushes the same manifest under
      # each tag rather than wrapping it in a new index, so the digest is
      # unchanged and the attestations - attached to that digest - stay findable.
      # Verified against a scratch registry before relying on it.
      - name: Publish tags
        if: inputs.push
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |-
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")

          if [[ ${#args[@]} -eq 0 ]]; then
            echo "::error title=Publish tags::docker/metadata-action produced no tags"
            exit 1
          fi

          docker buildx imagetools create "${args[@]}" "${IMAGE_REF}@${DIGEST}"
