apiVersion: batch/v1
kind: CronJob
metadata:
  name: vw-backup
spec:
  schedule: "0 */12 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 4
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      # concurrencyPolicy is Forbid, so a job that never returns blocks every
      # later backup indefinitely and silently. Successful runs take well under
      # a minute; this bounds a hung one instead of letting it wedge the schedule.
      activeDeadlineSeconds: 900
      template:
        spec:
          containers:
            - name: backup
              image: ghcr.io/theadzik/vw-backup:main
              imagePullPolicy: Always
              volumeMounts:
                - mountPath: /backup
                  name: backup
                - mountPath: /.config/rclone
                  name: rclone-conf
                - mountPath: /data
                  name: data
                  readOnly: true
                - mountPath: /tmp
                  name: tmp
              envFrom:
                - secretRef:
                    name: backup-encryption-secret
              env:
                - name: BACKUP_LOCAL_DIR
                  value: "/backup"
                - name: BACKUP_REMOTE_DIR
                  value: "gdrive:backup"
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1"
          affinity:
            # The data PVC is an iSCSI volume that can attach to several nodes at
            # once, and vaultwarden keeps its SQLite DB in WAL mode. WAL readers
            # coordinate with the writer through the -shm mmap, which is only
            # coherent within one host, so a backup scheduled onto a different node
            # never sees a settled snapshot and sqlite3 .backup restarts its copy
            # forever. Pin the backup to whichever node vaultwarden is running on.
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: vaultwarden
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: vaultwarden-data
            - name: backup
              persistentVolumeClaim:
                claimName: vaultwarden-backup
            - name: rclone-conf
              secret:
                secretName: rclone-secret
            - name: tmp
              emptyDir: {}
          restartPolicy: Never
