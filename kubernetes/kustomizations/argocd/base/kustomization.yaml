# Shared by both environments. Two files are not here, because both differ per
# environment: the bootstrap Application, and the Traefik ServersTransport,
# whose serverName has to match the hostname ArgoCD's certificate is issued
# for.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - argocd-namespace.yaml
  - argocd-gitcrypt-secret.yaml
