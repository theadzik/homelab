apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: validate-image-attestations
spec:
  # No credentials: every image matched here is a public GHCR package.
  webhookConfiguration:
    timeoutSeconds: 30
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  # Audit until verification fits the webhook timeout with margin.
  validationActions:
    - Audit
  # Without this the webhook is consulted for every pod in the cluster and
  # records a vacuous pass for each, since .all() over no images is true.
  matchConditions:
    - name: only-our-images
      expression: >-
        object.spec.containers.exists(c, c.image.startsWith("ghcr.io/theadzik/"))
        || (has(object.spec.initContainers)
        && object.spec.initContainers.exists(c, c.image.startsWith("ghcr.io/theadzik/")))
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/theadzik/*"
  attestors:
    - name: cosign
      cosign:
        keyless:
          identities:
            # One signer. Dots are escaped so a lookalike host cannot match.
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/theadzik/github-workflows/\\.github/workflows/build-and-push\\.yaml@.+$"
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: sbom
      intoto:
        type: "https://spdx.dev/Document/v2.3"
    - name: provenance
      intoto:
        type: "https://slsa.dev/provenance/v1"
  validationConfigurations:
    mutateDigest: true
    required: true
    verifyDigest: true
  validations:
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers).map(image,
          verifyImageSignatures(image, [attestors.cosign])
        ).all(e, e > 0)
      message: Failed to verify image signature
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers).map(image,
          verifyAttestationSignatures(image, attestations.sbom, [attestors.cosign])
        ).all(e, e > 0)
      message: "Failed to verify SBOM attestation signature"
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers).map(image,
          verifyAttestationSignatures(image, attestations.provenance, [attestors.cosign])
        ).all(e, e > 0)
      message: "Failed to verify provenance attestation signature"
