apiVersion: apps/v1
kind: Deployment
metadata:
  name: repwise-trigger
  labels:
    app: repwise-trigger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repwise-trigger
  # The run lock is held in the process, so an old pod finishing a run and a new
  # one accepting another must never overlap.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: repwise-trigger
    spec:
      # Longer than the ten minutes server.py allows a run, which it finishes
      # before exiting. With no run in progress both containers stop at once,
      # so this is only ever waited out by one.
      terminationGracePeriodSeconds: 630
      containers:
        - name: repwise-trigger
          # Replaced by `images:` in kustomization.yaml, which Image Updater
          # maintains.
          image: ghcr.io/theadzik/repwise-trigger:main
          imagePullPolicy: Always
          env:
            # workouts.yaml names its paths from the home directory of the
            # laptop it is edited on: ~/.config/repwise for the Garmin tokens,
            # ~/git/workouts/dumps for cached sessions. With HOME on the volume
            # the same file puts both there, and is downloaded to where that
            # layout would have it.
            - name: HOME
              value: /data
            - name: REPWISE_CONFIG
              value: /data/git/workouts/workouts.yaml
            - name: CONFIG_URL
              value: https://api.github.com/repos/theadzik/workouts/contents/workouts.yaml
          envFrom:
            - secretRef:
                name: trigger-secret
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /tmp
              name: tmp
        # Decides who may press the button. A container in this pod rather than
        # a middleware on the Ingress, because the application listens on
        # localhost alone: there is then no route to it that skips the sign-in,
        # whatever becomes of the Ingress.
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          args:
            - --provider=github
            # With no organisation or repository named, this list is the whole
            # of who gets in. The provider wants an email rule as well, and
            # GitHub usernames are the one that means something here.
            - --github-user=theadzik
            - --email-domain=*
            - --upstream=http://127.0.0.1:8080
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://repwise.zmuda.pro/oauth2/callback
            - --reverse-proxy=true
            - --skip-provider-button=true
            # The session is a cookie, so the button is a cross-site request
            # away from anyone's page unless the browser is told otherwise.
            - --cookie-samesite=lax
            # A month. The default week would have the sign-in turn up at the
            # gym, which is where this is used.
            - --cookie-expire=720h
            # The readiness probe, which would otherwise be most of the log.
            - --silence-ping-logging=true
          envFrom:
            - secretRef:
                name: oauth2-proxy-secret
          ports:
            - containerPort: 4180
              protocol: "TCP"
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # Only while the volume is new. A recursive change on every mount would
        # add group access to the Garmin tokens, which garminconnect writes
        # 0600 and repwise warns about finding otherwise.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: repwise-home
        - name: tmp
          emptyDir: {}
