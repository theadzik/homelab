apiVersion: apps/v1
kind: Deployment
metadata:
  name: repwise-trigger
  labels:
    app: repwise-trigger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repwise-trigger
  # The volume is ReadWriteOnce, so the old pod has to let go of it before a new
  # one can start.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: repwise-trigger
    spec:
      containers:
        - name: repwise-trigger
          # Replaced by `images:` in kustomization.yaml, which Image Updater
          # maintains.
          image: ghcr.io/theadzik/repwise-trigger:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: "TCP"
          env:
            # workouts.yaml names its paths from the home directory of the
            # laptop it is edited on: ~/.config/repwise for the Garmin tokens,
            # ~/git/workouts/dumps for cached sessions. With HOME on the volume
            # the same file puts both there, and is downloaded to where that
            # layout would have it.
            - name: HOME
              value: /data
            - name: REPWISE_CONFIG
              value: /data/git/workouts/workouts.yaml
            - name: CONFIG_URL
              value: https://api.github.com/repos/theadzik/workouts/contents/workouts.yaml
          envFrom:
            - secretRef:
                name: trigger-secret
          # A TCP check, because an HTTP one would be a line in the log every
          # few seconds, between the runs that log is kept for.
          readinessProbe:
            tcpSocket:
              port: 8080
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /tmp
              name: tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # Only while the volume is new. A recursive change on every mount would
        # add group access to the Garmin tokens, which garminconnect writes
        # 0600 and repwise warns about finding otherwise.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: repwise-data
        - name: tmp
          emptyDir: {}
