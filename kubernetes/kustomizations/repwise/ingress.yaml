apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: repwise-trigger
  annotations:
    cert-manager.io/cluster-issuer: "lets-encrypt-prod"
    # external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    # external-dns.alpha.kubernetes.io/target: "e48d5ef2-41f9-4ca5-a8bf-f60af8d77921.cfargotunnel.com"
    # traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare@kubernetescrd"
  labels:
    # External, because the point is to reach it from the gym. What keeps it
    # from being anyone's button is the oauth2-proxy the Service points at.
    dns-type: internal
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - repwise.zmuda.pro
      secretName: repwise-trigger-tls
  rules:
    - host: repwise.zmuda.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: repwise-trigger-http
                port:
                  number: 4180
