apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Named for the trigger it used to serve. A new name would mean a new TLS
  # secret and certificate for the same host.
  name: repwise-trigger
  annotations:
    cert-manager.io/cluster-issuer: "lets-encrypt-prod"
  labels:
    # The home network only. Signing in with GitHub still works on a name the
    # internet cannot resolve: GitHub sends the browser back to the callback,
    # and never calls the site itself.
    dns-type: internal
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - repwise.zmuda.pro
      secretName: repwise-trigger-tls
  rules:
    - host: repwise.zmuda.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # oauth2-proxy in the api pods, which signs the visitor in before
              # anything reaches the API.
              service:
                name: repwise-api
                port:
                  name: http
