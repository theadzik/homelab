apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Named for the trigger it used to serve. A new name would mean a new TLS
  # secret and certificate for the same host.
  name: repwise-trigger
  annotations:
    cert-manager.io/cluster-issuer: "lets-encrypt-prod"
    # Published through the tunnel, as the blog is: a proxied CNAME to it, and
    # the visitor's address put back from what Cloudflare says it was.
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    external-dns.kubernetes.io/target: "e48d5ef2-41f9-4ca5-a8bf-f60af8d77921.cfargotunnel.com"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare@kubernetescrd"
  labels:
    # On the internet, so that it works at the gym. What keeps it from being
    # anyone's button is the GitHub sign-in in front of the API.
    dns-type: external
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - repwise.zmuda.pro
      secretName: repwise-trigger-tls
  rules:
    - host: repwise.zmuda.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # oauth2-proxy in the api pods, which signs the visitor in before
              # anything reaches the API.
              service:
                name: repwise-api
                port:
                  name: http
