apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: repwise-trigger-netpol
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # workouts.yaml, from the repository it is kept in, and the sign-in:
    # oauth2-proxy trades the code for a token at github.com and asks the API
    # whose it is.
    - toFQDNs:
        - matchName: api.github.com
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Garmin Connect. A pattern matches one label, so the host that sits two
    # levels down is named.
    - toFQDNs:
        - matchPattern: "*.garmin.com"
        - matchName: mobile.integration.garmin.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
