apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: repwise-trigger-home
spec:
  # Holds the Garmin tokens, which are rewritten whenever they are refreshed and
  # so cannot be a Secret, and nothing that is not replaced by logging in again
  # or by the next run. Hence no backup label, and a class that deletes.
  #
  # ReadWriteMany so that a replacement pod on another node is not held up
  # waiting for the old one's node to let go of the volume.
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  # The -fsgroup class, whose mode for the volume's root is the one the kubelet
  # leaves after giving the volume to the pod's fsGroup. Under the other NFS
  # classes the driver takes group write off the root on every mount, and the
  # kubelet answers by going over every file again: the Garmin tokens would
  # come out 0660 after each restart.
  storageClassName: "synology-nfs-delete-fsgroup"
