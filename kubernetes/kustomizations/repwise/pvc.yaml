apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: repwise-trigger-home
spec:
  # Holds the Garmin tokens, which are rewritten whenever they are refreshed and
  # so cannot be a Secret, and nothing that is not replaced by logging in again
  # or by the next run. Hence no backup label, and a class that deletes.
  #
  # ReadWriteMany so that a replacement pod on another node is not held up
  # waiting for the old one's node to let go of the volume.
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  # The -anyuid class, because the pod does not own the share it is given and
  # may not run anything as root to change that: the other NFS classes leave
  # the volume's root writable by its owner alone.
  storageClassName: "synology-nfs-delete-anyuid"
