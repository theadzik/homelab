apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-pod-egress-to-nas-storage
spec:
  description: >-
    Defence-in-depth for storage. NFS and iSCSI volumes are mounted by the
    synology-csi node DaemonSet on the host network, so application pods never
    open their own connection to the NAS storage ports. This clusterwide policy
    makes that explicit: pod egress to the NAS on those ports is denied. The rule
    is subtractive (it changes no pod's existing allow-posture) and does not
    select the host (reserved:host), so the driver's own mounts are unaffected.
    Garage S3 on :3900 stays allowed for Velero and Vaultwarden backups.
  endpointSelector: {}
  egressDeny:
    - toCIDR:
        - 192.168.0.6/32
        - 192.168.0.7/32
      toPorts:
        - ports:
            - port: "2049" # NFSv4.1 / NFSv3 data
              protocol: TCP
            - port: "111" # rpcbind / portmapper (NFSv3)
              protocol: TCP
            - port: "111"
              protocol: UDP
            # Also denied: no pod uses these over the pod network either.
            - port: "3260" # iSCSI
              protocol: TCP
            - port: "3493" # NUT / UPS
              protocol: TCP
