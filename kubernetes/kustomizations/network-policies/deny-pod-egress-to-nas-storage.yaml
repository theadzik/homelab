apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-pod-egress-to-nas-storage
spec:
  description: >-
    Defence-in-depth for storage. NFS and iSCSI volumes are mounted by the
    synology-csi driver on the host network, so application pods never open their
    own connection to the NAS storage ports. This clusterwide policy denies pod
    egress to the NAS (192.168.0.6/7) on those ports only. Subtractive; does not
    select the host (reserved:host), so the driver's own mounts are unaffected.
    It deliberately targets only the NAS on storage ports — never a wider CIDR.
    A whole-LAN (/16) deny is NOT usable here and must not be reintroduced: the
    control plane and DNS upstream share this LAN, and Cilium cannot carve the
    kube-apiserver identity back out of a CIDR deny (a toCIDRSet `except` on the
    node IP does not work — verified: pod->192.168.0.2:6443 stays DROPPED), so a
    /16 deny takes every pod's API access and cluster DNS down with it.
  endpointSelector: {}
  egressDeny:
    - toCIDR:
        - 192.168.0.6/32
        - 192.168.0.7/32
      toPorts:
        - ports:
            - port: "2049" # NFSv4.1 / NFSv3 data
              protocol: TCP
            - port: "111" # rpcbind / portmapper (NFSv3)
              protocol: TCP
            - port: "111"
              protocol: UDP
            - port: "3260" # iSCSI
              protocol: TCP
            - port: "3493" # NUT / UPS
              protocol: TCP
