apiVersion: apps/v1
kind: Deployment
metadata:
  name: zmuda-pro-blog
  labels:
    app: zmuda-pro-blog
spec:
  # With probes in place, a rollout of a broken image should stall rather than
  # replace healthy pods. maxUnavailable: 0 keeps the running version serving
  # until the replacement reports ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      priorityClassName: high-priority
      containers:
        - name: nginx
          # Always replaced by each overlay's `images:` newTag - dev tracks sha-
          # builds of main, prod tracks CalVer releases. Kept as `main` so that an
          # overlay which forgot to override would still land on reviewed code
          # rather than a stale pin (this previously read 2026.5.1, months old).
          image: ghcr.io/theadzik/zmuda-pro-blog:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: "TCP"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # The image uses Alpine's nginx layout: temp files under
          # /var/lib/nginx/tmp, pid in /run/nginx. /var/lib/nginx is 0750
          # nginx:nginx, so the pod must run as the image's nginx user (65532)
          # to reach the tmp mount at all.
          volumeMounts:
            - mountPath: /var/lib/nginx/tmp
              name: tmp
            - mountPath: /run/nginx
              name: run
          # Without a readinessProbe the pod is Ready as soon as nginx starts, so
          # an image that boots but serves nothing (an empty document root from a
          # builder stage that produced no output) rolls out as healthy. ArgoCD
          # auto-sync plus Image Updater means that happens unattended, so this is
          # the only thing standing between a bad build and live traffic.
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            failureThreshold: 15 # 30s to serve a first response
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # Memory only. It is non-compressible, so a leak without a ceiling
              # pressures the whole node; requests plus priorityClassName already
              # handle CPU contention, and a CPU limit would just add throttling.
              # VPA (InPlaceOrRecreate) scales this with requests, preserving the
              # ratio.
              memory: 128Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
