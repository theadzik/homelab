{{- if .Values.networkPolicy.enabled }}
{{- $stack := include "media-stack.name" . }}
{{- $ingressNamespaces := .Values.networkPolicy.ingressNamespaces | default (list) }}
{{- $fromNamespaces := concat (list .Release.Namespace) $ingressNamespaces | uniq }}
{{- range $svcName, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ printf "%s-%s-netpol" $svcName $.Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "media-stack.componentLabels" (dict "component" $svcName "context" $) | nindent 4 }}
spec:
  description: >-
    {{ $svcName }}: ingress only from the media stack itself{{ if $ingressNamespaces }} and
    {{ join ", " $ingressNamespaces }}{{ end }}; egress to the internet{{ if or $.Values.networkPolicy.egressDenyCIDRs $.Values.networkPolicy.egressDenyEntities }}, denied to the LAN and control plane{{ end }}.
  endpointSelector:
    matchLabels:
      "k8s:app.kubernetes.io/name": {{ $svcName | quote }}
      "k8s:app.kubernetes.io/instance": {{ $.Release.Name | quote }}
      "k8s:app.kubernetes.io/part-of": {{ $stack | quote }}
  ingress:
    - fromEndpoints:
        {{- range $ns := $fromNamespaces }}
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": {{ $ns | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ $svc.port | quote }}
              protocol: TCP
  egress:
    # Stated explicitly so that the `world` rule below does not silently break
    # name resolution.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The stack talks to itself: the *arr apps drive NZBGet, Bazarr reaches the
    # *arr APIs. Kept in-cluster so `world` below need not include it.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": {{ $.Release.Namespace | quote }}
    # Indexers, usenet providers, metadata and subtitle APIs live on the public
    # internet only — external destinations, not the cluster, nodes or host.
    - toEntities:
        - world
  {{- if or $.Values.networkPolicy.egressDenyCIDRs $.Values.networkPolicy.egressDenyEntities }}
  # Storage is node-mounted, not reached over the pod network, so denying the LAN
  # here does not affect volumes. These apps have no need to reach the LAN or the
  # control plane, so that egress is denied.
  egressDeny:
    {{- with $.Values.networkPolicy.egressDenyCIDRs }}
    - toCIDR:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
    {{- with $.Values.networkPolicy.egressDenyEntities }}
    - toEntities:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
