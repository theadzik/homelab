apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: repwise
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - path: kubernetes/kustomizations/repwise
      repoURL: "{{ .Values.spec.sources.repoURL }}"
      targetRevision: "{{ .Values.spec.sources.targetRevision }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: repwise
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      refresh: true
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted

---

apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: repwise
spec:
  applicationRefs:
    - namePattern: "repwise"
      writeBackConfig:
        method: "git"
        gitConfig:
          repository: "{{ .Values.spec.sources.repoURL }}"
          branch: "{{ .Values.spec.sources.targetRevision }}"
          writeBackTarget: "kustomization:/kubernetes/kustomizations/repwise"
      images:
        - alias: "repwise-trigger"
          imageName: "ghcr.io/theadzik/repwise-trigger"
          commonUpdateSettings:
            updateStrategy: "semver"
            allowTags: "regexp:^[0-9]{4}\\.([1-9]|1[0-2])\\.[1-9][0-9]*$"
        - alias: "oauth2-proxy"
          imageName: "quay.io/oauth2-proxy/oauth2-proxy"
          commonUpdateSettings:
            updateStrategy: "semver"
            allowTags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+$"
