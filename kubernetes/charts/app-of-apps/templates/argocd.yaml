{{- if has "argocd" .Values.enabledApps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-99"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: argo-cd
      repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 10.3.3
      helm:
        releaseName: argocd
        valueFiles:
          - $repo/kubernetes/helm/argocd/values.yaml
          - $repo/kubernetes/helm/argocd/values-{{ .Values.env }}.yaml
{{- /* Dex's GitHub connector and the GitHub App credential template. Not loaded
       in dev: they are prod's own credentials, and a Docker cluster has no use
       for either. See kubernetes/helm/argocd/values-dev.yaml. */ -}}
{{- if eq .Values.env "prod" }}
          - $repo/kubernetes/helm/argocd/values-secret.yaml
{{- end }}
    - path: kubernetes/kustomizations/argocd/overlays/{{ .Values.env }}
      repoURL: "{{ .Values.spec.sources.repoURL }}"
      targetRevision: "{{ .Values.spec.sources.targetRevision }}"
      ref: repo
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      refresh: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
{{- end }}
