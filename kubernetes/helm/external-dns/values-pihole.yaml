provider:
  name: pihole
env:
  - name: EXTERNAL_DNS_PIHOLE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pihole-secret
        key: EXTERNAL_DNS_PIHOLE_PASSWORD
extraArgs:
  pihole-server: "https://pihole.zmuda.pro"
labelFilter: dns-type in (internal)
registry: noop
policy: upsert-only
