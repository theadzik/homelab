# The hostname ArgoCD serves and links to, and the GitHub org that can log in.
# Everything authentication-related that is not a secret lives here; the Dex
# connector and the credential template are in values-secret.yaml.
global:
  domain: argocd.zmuda.pro

configs:
  rbac:
    policy.csv: |
      p, role:authenticated, *, *, *, deny
      g, zmuda-pro:argocd-admins, role:admin
    policy.default: role:authenticated
    scopes: "[groups, email]"
    policy.matchMode: "glob"

server:
  ingress:
    labels:
      dns-type: internal
  certificate:
    enabled: true
    secretName: argocd-server-tls
    issuer:
      name: lets-encrypt-prod
      kind: ClusterIssuer
    domain: argocd.zmuda.pro
