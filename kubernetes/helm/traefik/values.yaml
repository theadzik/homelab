deployment:
  replicas: 2
  minReadySeconds: 10

podDisruptionBudget:
  enabled: true
  minAvailable: 1

priorityClassName: "system-cluster-critical"

topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/name: "{{ template \"traefik.name\" . }}"
    matchLabelKeys:
      - pod-template-hash
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

experimental:
  plugins:
    cloudflare:
      moduleName: github.com/agence-gaya/traefik-plugin-cloudflare
      version: v1.2.0

accessLog:
  enabled: true
  format: json
  fields:
    headers:
      names:
        User-Agent: keep

ports:
  # The two below are the default entry points, so a router whose Ingress names
  # none lands on them alone and never on `tunnel`. Without a default, Traefik
  # puts such a router on every entry point there is.
  web:
    asDefault: true
    forwardedHeaders:
      # The pod network: cloudflared, which is still what connects here while
      # a tunnel route points at websecure. Cloudflare's own ranges are not
      # listed because Cloudflare never connects to Traefik; it reaches the
      # cluster only through cloudflared.
      trustedIPs: &trustedIPs
        - 10.0.0.0/8
    proxyProtocol:
      trustedIPs: *trustedIPs
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    asDefault: true
    forwardedHeaders:
      trustedIPs: *trustedIPs
    proxyProtocol:
      trustedIPs: *trustedIPs
  # What the Cloudflare tunnel reaches. Only routers that name it serve on it,
  # with `traefik.ingress.kubernetes.io/router.entrypoints: websecure,tunnel`,
  # so an internal site cannot be reached through the tunnel whatever hostname
  # a request arrives with. On the ClusterIP Service `traefik-tunnel` alone,
  # not on the LoadBalancer the home network uses.
  tunnel:
    port: 9443
    exposedPort: 443
    expose:
      default: false
      tunnel: true
    forwardedHeaders:
      # cloudflared, from the pod network. Nothing else connects here.
      trustedIPs:
        - 10.0.0.0/8
    http:
      tls:
        enabled: true
      # Everything here came through Cloudflare, so every request gets the
      # visitor's address back from CF-Connecting-IP. On the entry point rather
      # than on each Ingress, because the plugin also refuses whatever did not
      # come from Cloudflare or the pod network - the home network, on
      # websecure.
      middlewares:
        - traefik-cloudflare@kubernetescrd

service:
  additionalServices:
    tunnel:
      spec:
        type: ClusterIP
