deployment:
  replicas: 2
  minReadySeconds: 10

podDisruptionBudget:
  enabled: true
  minAvailable: 1

priorityClassName: "system-cluster-critical"

topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/name: "{{ template \"traefik.name\" . }}"
    matchLabelKeys:
      - pod-template-hash
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

experimental:
  plugins:
    cloudflare:
      moduleName: github.com/agence-gaya/traefik-plugin-cloudflare
      version: v1.2.0

accessLog:
  enabled: true
  format: json
  fields:
    headers:
      names:
        User-Agent: keep

ports:
  # The two below are the default entry points, so a router whose Ingress names
  # none lands on them alone and never on `tunnel`. Without a default, Traefik
  # puts such a router on every entry point there is.
  web:
    asDefault: true
    forwardedHeaders:
      trustedIPs: &trustedIPs
        - 10.0.0.0/8
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
    proxyProtocol:
      trustedIPs: *trustedIPs
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    asDefault: true
    forwardedHeaders:
      trustedIPs: *trustedIPs
    proxyProtocol:
      trustedIPs: *trustedIPs
  # What the Cloudflare tunnel reaches. Only routers that name it serve on it,
  # with `traefik.ingress.kubernetes.io/router.entrypoints: websecure,tunnel`,
  # so an internal site cannot be reached through the tunnel whatever hostname
  # a request arrives with. On the ClusterIP Service `traefik-tunnel` alone,
  # not on the LoadBalancer the home network uses.
  tunnel:
    port: 9443
    exposedPort: 443
    expose:
      default: false
      tunnel: true
    forwardedHeaders:
      # cloudflared, from the pod network. Nothing else connects here.
      trustedIPs:
        - 10.0.0.0/8
    http:
      tls:
        enabled: true

service:
  additionalServices:
    tunnel:
      spec:
        type: ClusterIP
