# Everything here exists because prod sits behind Cloudflare. The trusted-IP
# lists are Cloudflare's published ranges plus the LAN, so that a client address
# is only taken from X-Forwarded-For or PROXY protocol when the hop really was
# Cloudflare or cloudflared. Trusting those headers from an untrusted peer would
# let any client claim any source address.
#
# The plugin is fetched from GitHub at startup, which is a network dependency
# worth keeping out of a cluster that has no Cloudflare in front of it at all.
experimental:
  plugins:
    cloudflare:
      moduleName: github.com/agence-gaya/traefik-plugin-cloudflare
      version: v1.2.0

ports:
  web:
    forwardedHeaders:
      trustedIPs: &trustedIPs
        - 10.0.0.0/8
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
    proxyProtocol:
      trustedIPs: *trustedIPs
  websecure:
    forwardedHeaders:
      trustedIPs: *trustedIPs
    proxyProtocol:
      trustedIPs: *trustedIPs
