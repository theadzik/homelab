image:
  pullPolicy: IfNotPresent

registries:
  - name: Docker Hub
    prefix: docker.io
    api_url: https://registry-1.docker.io
    credentials: pullsecret:argocd/dockerhub-image-pull-secret
    limit: 10
    default: true

  # Our own images. Public packages, so tag listing needs no credentials - GHCR
  # hands out an anonymous pull token to any client that asks. It also applies no
  # pull rate limit, which is the whole reason these images moved here, so the
  # concurrency limit is set well above Docker Hub's.
  - name: GitHub Container Registry
    prefix: ghcr.io
    api_url: https://ghcr.io
    limit: 30

tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
    tolerationSeconds: 300
  - effect: NoExecute
    key: node.kubernetes.io/unreachable
    operator: Exists
    tolerationSeconds: 300

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: In
              values:
                - "true"
        weight: 1
