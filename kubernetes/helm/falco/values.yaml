tty: true
falcosidekick:
  enabled: true
  webui:
    enabled: true
    replicaCount: 1
    customLabels:
      dns-type: internal
    redis:
      storageClass: synology-iscsi-delete-ssd
    ingress:
      enabled: true
      ingressClassName: "traefik"
      annotations:
        cert-manager.io/cluster-issuer: lets-encrypt-prod
      hosts:
        - host: falcosidekick.zmuda.pro
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: falcosidekick-tls
          hosts:
            - falcosidekick.zmuda.pro
    existingSecret: falcosidekick-ui-config
  config:
    existingSecret: falcosidekick-config
    smtp:
      minimumpriority: "error"

customRules:
  rules-cilium-exceptions.yaml: |-
    - rule: Drop and execute new binary in container
      exceptions:
        - name: cilium_cni_exec
          fields: [proc.exepath, container.image.repository]
          comps: [=, =]
          values:
            - [/opt/cni/bin/cilium-cni, quay.io/cilium/cilium]
            - [/opt/cni/bin/cilium-sysctlfix, quay.io/cilium/cilium]
        - name: cilium_cni_plugin_runtime_exec
          fields: [proc.exepath, proc.pname]
          comps: [=, =]
          values:
            - [/opt/cni/bin/cilium-cni, containerd]
      override:
        exceptions: append

    - rule: Packet socket created in container
      exceptions:
        - name: cilium_agent_packet_socket
          fields: [k8s.ns.name, container.image.repository, proc.name]
          comps: [=, =, =]
          values:
            - [kube-system, quay.io/cilium/cilium, cilium-agent]
      override:
        exceptions: append
