# Dev does not set `rotate-server-certificates` on the kubelet, because the
# approver that signs those CSRs cannot run before the CNI that dev applies
# after boot - talos/patch-prod.yaml has the full reasoning. So kubelet serving
# certificates here are self-signed and metrics-server has to be told to accept
# them, or every scrape fails the handshake and no node ever reports metrics.
#
# This is scoped as tightly as it can be: it affects metrics-server's
# connection out to the kubelets, and nothing else. `tls.type: cert-manager` in
# values.yaml still governs metrics-server's own serving certificate, and
# `apiService.insecureSkipTLSVerify: false` still holds, so the API server
# still verifies metrics-server.
args:
  - --kubelet-insecure-tls
